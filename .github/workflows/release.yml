name: Release Workflow

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**"]

  workflow_dispatch:

  release:
    types: [published]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.1]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          lfs: true

      - name: Verify Go code
        uses: ./.github/actions/go-verify
        with:
          go-version: ${{ matrix.go-version }}

  create-release:
    name: release
    if: github.event_name != 'release'
    needs: test
    runs-on: ubuntu-latest

    outputs:
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '25.8.1'

      - name: Install dependencies
        run: npm install

      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v5.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-binaries:
    # A UI-published release skips create-release; still build after tests pass.
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
          (github.event_name == 'release' ||
           needs.create-release.outputs.new_release_version != '') }}
    runs-on: ubuntu-latest
    needs:
      - test
      - create-release
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', needs.create-release.outputs.new_release_version) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ env.RELEASE_TAG }}
          ldflags: -X github.com/ci4rail/moducop-core-api-server/internal/buildinfo.Version=${{ env.RELEASE_TAG }}
          build_flags: -tags netgo,osusergo,static_build
          goos: linux
          goarch: arm64
          goversion: "https://go.dev/dl/go1.26.1.linux-amd64.tar.gz"
          project_path: "./cmd/api-server"
          binary_name: "core-api-server"
          extra_files: LICENSE CHANGELOG.md
      - name: Copy deployment tree
        run: >
          mkdir -p dist/deployment &&
          cp -a deploy/. dist/deployment/
      - name: Build deployment package binary
        run: >
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          go build
          -tags netgo,osusergo,static_build
          -ldflags "-X github.com/ci4rail/moducop-core-api-server/internal/buildinfo.Version=${RELEASE_TAG}"
          -o dist/deployment/overlay-etc/upper/core-api-server
          ./cmd/api-server
      - name: Create deployment archive
        run: >
          tar -C dist/deployment -czf
          "core-api-server-${RELEASE_TAG}-linux-arm64-deployment.tar.gz"
          .
      - name: Upload deployment archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload
          "$RELEASE_TAG"
          "core-api-server-${RELEASE_TAG}-linux-arm64-deployment.tar.gz"
          --clobber
